name = "LIP"
grammar = "lip"
path_suffixes = ["lip"]
line_comments = ["# "]
autoclose_before = ";:.,=}])"
brackets = [
  { start = "{", end = "}", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "[", end = "]", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "(", end = ")", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]

[overrides.string]
auto_indent_on_paste = false
